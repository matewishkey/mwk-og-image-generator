name: Y2K Chrome
description: >-
  Liquid chrome, holographic sheen and millennium-bug optimism. The retro-future look
  trending back through fashion and consumer social.
look: >-
  Y2K retro-futurism: liquid chrome and iridescent surfaces reflecting a gradient sky of
  silver, baby blue and pink. Soft low-poly artifacts and a faint scanline shimmer nod to
  early CGI without breaking the render. Lens flares are small, star-shaped and sincere.
  Everything is glossy, curved and optimistic, floating in a bright airbrushed space with
  a horizon glow.
subject: >-
  Rendered with a subtle holographic sheen on clothing and hair highlights, like an early
  2000s album-cover portrait — glossy but still clearly them.
avoid: >-
  grunge, matte surfaces, dark cyberpunk palettes, film grain, brutalist typography shapes
tags: [y2k, chrome, iridescent, retro-future]
origin: hand
