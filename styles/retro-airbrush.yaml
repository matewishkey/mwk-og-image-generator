name: Retro Airbrush
description: >-
  Smooth 80s airbrush gradients, sunset palette, slick poster sheen. Retro-futurism's
  painterly wing.
look: >-
  1980s airbrush poster art: silky graded shading with soft glows and chrome-adjacent
  highlights, laid in smooth sweeping passes. Sunset palette — magenta, orange, violet,
  deep blue — with a horizon glow and a few crisp white speculars. Surfaces look polished
  and slightly idealised; edges alternate razor-crisp against soft-faded. Finish is a
  slick printed poster with the faintest spray grain.
subject: >-
  Painted in idealised airbrush portrait style — smooth graded skin planes, glowing rim
  light in the palette colours, hair with sweeping highlight bands.
avoid: >-
  flat fills, hard cel shading, film grain, muted palettes, digital photo realism
tags: [airbrush, retro, sunset, glow]
origin: hand
