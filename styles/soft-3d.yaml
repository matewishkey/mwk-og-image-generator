name: Soft 3D
description: >-
  Friendly rounded 3D render — the look that replaced flat corporate illustration across
  SaaS marketing. Approachable but premium.
look: >-
  Polished 3D render with smooth, rounded, slightly inflated forms and softly bevelled
  edges. Matte-to-satin surfaces, no hard gloss. Big soft studio lighting with gentle
  ambient occlusion and one pastel-tinted fill, floating on a seamless pastel ground with
  a soft contact shadow. Palette of two or three pastels plus one saturated hero colour.
  Everything sits in calm, deliberate arrangements with lots of negative space.
subject: >-
  A stylised 3D character with simplified friendly proportions and matte skin, recognisable
  by hair, build and glasses rather than photoreal facial detail.
avoid: >-
  photorealism, hard reflections, clay fingerprints, cartoon outlines, busy backgrounds
tags: [3d, soft, saas, friendly]
origin: hand
