name: Duotone Poster
description: >-
  The whole image mapped to two colours. Forces brand consistency onto any picture; a
  quiet OG-card favourite.
look: >-
  Strict duotone: the entire image tone-mapped to exactly two colours — one deep, one
  bright — with rich mid-tone blending between them and nothing else. High-contrast
  poster finish with crisp edges and slightly lifted blacks, composed like a music-venue
  gig poster: one dominant subject, dramatic scale, flat background field. A whisper of
  print grain keeps it from feeling digital.
subject: >-
  A high-contrast duotone portrait treatment — features carved out by the two-colour
  split, silhouette doing most of the work, unmistakably them at a glance.
avoid: >-
  a third colour, full-colour patches, gradients to white, busy backgrounds, thin details
tags: [duotone, poster, brandable, graphic]
origin: hand
