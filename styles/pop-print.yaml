name: Pop Print
description: >-
  Screen-print pop art with Ben-Day dots and heavy outlines. Attention-grabbing, loud on
  purpose.
look: >-
  Classic pop-art screen print: bold flat primary colours laid in slightly misregistered
  layers, heavy black outlines, and Ben-Day halftone dots filling the mid-tones. High
  contrast, poster-flat space with a single graphic background colour, and one exaggerated
  focal element scaled up for punch. Ink sits matte on the surface with tiny print
  imperfections at the edges.
subject: >-
  Drawn as a screen-printed portrait — strong outline, halftone shading on the face, hair
  as one flat shape, expression bold and theatrical.
avoid: >-
  gradients, soft shadows, photorealism, muted palettes, clean vector smoothness
tags: [pop-art, halftone, bold, print]
origin: hand
