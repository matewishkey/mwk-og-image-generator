name: Long Exposure Night
description: >-
  Light trails and silky motion against tack-sharp stillness. Speed, momentum, progress.
look: >-
  Night long-exposure photography: streaming light trails and silky motion blur flowing
  through the frame while static elements stay tack-sharp. Deep clean blacks, saturated
  point lights blooming gently, cool ambient tones with one warm light source for
  contrast. Reflective surfaces double the lights; the exposure feels patient and
  deliberate, tripod-steady.
subject: >-
  The one sharp, still presence in the flow — motion streaming past them, lit by the
  nearest practical light, clearly recognisable.
avoid: >-
  daylight, frozen action, grain, HDR halos, cluttered mid-tones
tags: [photographic, night, long-exposure, motion]
origin: hand
