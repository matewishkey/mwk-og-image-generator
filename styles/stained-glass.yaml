name: Stained Glass
description: >-
  Lead-lined jewel panes with backlit glow. Strong at small sizes; made for story and
  values content.
look: >-
  Stained glass window: bold black lead lines dividing the image into cloisonné panes of
  translucent jewel-toned glass — ruby, cobalt, amber, emerald — each pane subtly varied
  in tone as if light passes through unevenly. Warm backlit glow, slight bubbling texture
  in the glass, composition organised into strong radial or arched panels. Forms are
  simplified to what leadwork can hold.
subject: >-
  Rendered as a stained-glass figure — face and hands in warm amber panes, features drawn
  by the lead lines, hair and clothes as coloured glass segments.
avoid: >-
  photographic texture, fine gradient detail, thin outlines, flat matte fills, pastels
tags: [stained-glass, jewel, glow, panels]
origin: hand
