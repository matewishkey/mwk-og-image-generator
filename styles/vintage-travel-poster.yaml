name: Vintage Travel Poster
description: >-
  Mid-century travel-poster flatness: bold shapes, warm matte palette. Instantly premium
  and legible at thumbnail size — great for announcements.
look: >-
  Mid-century travel poster illustration: bold simplified colour blocks with screenprint-flat
  gradients, confident geometric forms, and clean silhouetted edges. Warm matte palette of
  mustard, teal, coral and cream on paper-toned ground, with subtle print texture. Strong
  diagonal or low-horizon composition with one heroic focal element scaled generously;
  everything reads at a glance from across the room.
subject: >-
  Drawn as a poised poster figure — simplified planes, confident stance, likeness carried
  by silhouette, hair shape and outfit colour rather than facial detail.
avoid: >-
  photorealism, gradients beyond flat print wipes, thin fussy detail, neon colours, gloss
tags: [poster, mid-century, flat, warm]
origin: hand
