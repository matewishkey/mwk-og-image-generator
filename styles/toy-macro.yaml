name: Toy Macro
description: >-
  Studio macro photography of plastic toys. One consistent look so a set of scenes reads as
  a series rather than four unrelated pictures.
look: >-
  Macro product photography of real plastic construction bricks on a seamless studio sweep.
  Shot on a 100mm macro lens at f/8 so the whole miniature is sharp, with a big soft key from
  the upper left, a cool fill from the right, and crisp contact shadows. Slight tilt-shift
  falloff at the frame edges. Colours are saturated primary plastic — red, yellow, blue —
  against a clean neutral grey-blue ground. Visible moulding seams, stud tops, fingerprints
  and a little dust, so it reads as a photograph of real bricks rather than a 3D render.
subject: >-
  Any person present is a small brick minifigure with a printed face, not a real human.
avoid: >-
  3D render look, ray-traced perfection, CGI gloss, cartoon illustration, dark moody lighting
tags: [macro, toy, photographic, product]
origin: hand
