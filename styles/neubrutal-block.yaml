name: Neubrutal Block
description: >-
  Raw blocks, thick borders, hard offset shadows, clashing colour. The anti-corporate
  signal beloved of dev tools and indie brands.
look: >-
  Neubrutalist graphic design: chunky rectangular blocks with thick uniform black borders
  and hard, unblurred offset shadows. Flat unblended colours that deliberately clash — acid
  yellow, cobalt, salmon — on a plain pale ground. Elements sit slightly misaligned, like a
  layout that refuses to be polished. No rounded corners bigger than a coin, no gradients,
  no transparency; everything is opaque, flat and emphatic.
subject: >-
  Drawn as a flat sticker-like figure with a thick black outline and hard shadow, dropped
  onto the composition like a cut-out.
avoid: >-
  soft shadows, gradients, glassy surfaces, tasteful muted palettes, photographic elements
tags: [neubrutalism, graphic, bold, indie]
origin: hand
