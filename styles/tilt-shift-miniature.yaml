name: Tilt-Shift Miniature
description: >-
  Real scenes photographed to look like tiny models. Big-picture posts with instant charm.
look: >-
  Tilt-shift miniature photography: an elevated three-quarter aerial vantage with a narrow
  razor-sharp horizontal band of focus and heavy smooth blur above and below it. Slightly
  boosted saturation and contrast so the world reads as a hand-painted model; clean
  daylight with small crisp shadows. The scene keeps real-world detail but everything —
  vehicles, people, buildings — appears toy-scale.
subject: >-
  A tiny sharp figure inside the focus band, readable by posture and outfit colour at
  miniature scale — never a close-up.
avoid: >-
  eye-level framing, full-frame sharpness, muted desaturated grades, night scenes, macro toys
tags: [photographic, tilt-shift, aerial, miniature]
origin: hand
