name: Bricks For Real
description: >-
  Photoreal editorial photography where brick-built objects sit in the real world at real
  scale. One look for a four-panel series whose stakes escalate: the toy stays a toy, but the
  world around it gets more serious.
look: >-
  Documentary editorial photography, shot on a 35mm lens at f/4 with available light plus one
  soft fill. Natural colour, realistic contrast, real depth of field, honest skin tones and
  believable environmental grain — a photograph a magazine would run, not a render. The
  brick-built object in frame is genuinely made of moulded plastic construction bricks, with
  visible studs, moulding seams, panel gaps and slight misalignment, but it occupies real
  space in a real place at whatever scale the scene demands. Composition leaves the bottom of
  the frame calm.
subject: >-
  People are ordinary adults photographed straight — real clothes, real posture, unposed
  expressions. Never minifigures, never stylised, never caricatured.
avoid: >-
  3D render, CGI gloss, cartoon, illustration, studio toy-photography sweep, cute mascots,
  smiling stock-photo faces
tags: [photographic, documentary, editorial, escalating]
origin: hand
