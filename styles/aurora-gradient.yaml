name: Aurora Gradient
description: >-
  Luminous blurred colour fields with one crisp subject. The classic OG-card background
  look — brandable, text-friendly, never dates.
look: >-
  Large-scale abstract aurora gradient: two or three luminous colour fields blending with
  extremely soft edges, like light through frosted glass. Fine monochrome noise over the
  blend to kill banding. The subject is rendered crisp and simple in the foreground against
  the blur, with strong figure-ground separation. Composition is minimal — one subject, one
  gradient, vast negative space, no texture or scenery behind.
subject: >-
  Reduced to a clean simplified figure or silhouette with soft rim light borrowed from the
  gradient colours, identity carried by outline and hair shape.
avoid: >-
  hard geometric shapes, busy detail, photographic backgrounds, banding, lens flares
tags: [abstract, gradient, minimal, background]
origin: hand
