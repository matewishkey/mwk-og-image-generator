name: Quiet Minimal
description: >-
  One or two elements, vast emptiness, restrained colour. For cards where the headline does
  the talking and the picture just sets a tone.
look: >-
  Extreme minimalism: a single subject rendered small against a vast, evenly lit field of
  one muted colour. Matte finish, soft shadowless light, at most two tones plus a neutral.
  Composition places the subject far off-centre on a rule-of-thirds point, with the rest of
  the frame deliberately, luxuriously empty. No texture, no scenery, no props beyond the
  one that matters.
subject: >-
  A small, simply rendered figure — clean shapes, soft matte shading — readable at a
  glance, defined by silhouette and one gesture.
avoid: >-
  clutter, gradients, dramatic lighting, patterns, more than three colours, backgrounds
tags: [minimal, calm, negative-space]
origin: hand
