name: Naive Gouache
description: >-
  Charming wobbly gouache, storybook-bright. The human-touch look trending against AI
  polish.
look: >-
  Contemporary naive gouache illustration: flat opaque matte strokes with charmingly
  imperfect, wobbly shapes and edges that don't quite meet. Bright storybook palette laid
  in confident single passes, visible paper tooth through thinner patches, no outlines —
  forms are held by colour against colour. Perspective is cheerfully wrong, scale playful,
  composition warm and generous.
subject: >-
  Painted as a friendly naive figure — dot eyes, simple curved features, likeness carried
  by hair colour and outfit, proportions softly wrong on purpose.
avoid: >-
  clean vector edges, gradients, realistic anatomy, outlines, digital brush uniformity
tags: [gouache, naive, warm, storybook]
origin: hand
