name: Faded Film
description: >-
  Warm analogue photography that looks pulled from a shoebox of 90s prints. The anti-polish
  look that reads human in an AI-slick feed.
look: >-
  Analogue 35mm colour film photography with pronounced organic grain, slightly faded
  blacks and a warm expired-film cast — greens shifted olive, highlights creamy, a faint
  light leak at one edge. Mild vignetting, soft focus falloff, the small framing accidents
  of a point-and-shoot. Colours are muted but warm, like a print that sat in sunlight for a
  decade. Nothing is staged-looking; the frame feels found, not made.
subject: >-
  Photographed candidly on film — natural grain over the skin, caught mid-moment, never
  posed at the lens.
avoid: >-
  digital sharpness, clean whites, HDR, studio lighting, Instagram-filter teal-orange
tags: [photographic, film, retro, grain]
origin: hand
