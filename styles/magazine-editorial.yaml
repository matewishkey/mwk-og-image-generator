name: Magazine Editorial
description: >-
  Clean magazine-grade photography with nothing themed about it. The neutral default when
  the card should read as real content, not clip art.
look: >-
  Editorial photography for a quality print magazine, shot on a 50mm lens at f/2.8 with
  soft directional window light and one white bounce. True-to-life colour, gentle contrast,
  clean whites, honest shadows. Composition follows a clear focal hierarchy with generous
  breathing room, styled like an art-directed feature spread rather than a snapshot. Subtle
  natural grain, no filters, no colour cast.
subject: >-
  A real photograph of them — natural skin, natural light, relaxed unposed expression,
  wardrobe an ordinary person would wear. No retouching sheen.
avoid: >-
  HDR, heavy grading, stock-photo posing, studio seamless backdrops, plastic skin, filters
tags: [photographic, editorial, neutral, clean]
origin: hand
