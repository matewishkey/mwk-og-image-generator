name: Anime Panel
description: >-
  Cel-shaded anime with bold clean lines and big expression. For younger-skewing posts and
  anything that wants stylised emotion.
look: >-
  Modern anime cel shading: flat colour regions with two crisp shadow steps, bold clean
  outlines that vary subtly in weight, and vivid saturated colour against a softly painted
  background with atmospheric depth. Expressive lighting — rim light on hair, a bloom on
  the brightest surface. Composition uses dynamic angles and depth-of-field like a key
  visual, not a comic page.
subject: >-
  Drawn as an anime character with proportions kept adult and grounded; hair shape,
  glasses and build carry the likeness, expressions readable and big.
avoid: >-
  chibi proportions, manga screentone, speech bubbles, photoreal rendering, western cartoon
tags: [anime, cel-shaded, vivid, stylised]
origin: hand
