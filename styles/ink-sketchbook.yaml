name: Ink Sketchbook
description: >-
  Loose hand-drawn ink and wash, wobbles included. Signals a human hand in a feed full of
  machine gloss.
look: >-
  Hand-drawn ink illustration on warm off-white paper with visible tooth. Confident but
  imperfect linework — wobbling contours, varying line weight, the occasional overshoot
  left in. Sparse grey ink-wash shading and one restrained accent colour applied loosely
  outside the lines. Composition sits like a sketchbook page: generous margins, elements
  breathing, a few construction marks faintly visible.
subject: >-
  Drawn with a few economical lines — hair, glasses and posture carry the likeness; faces
  are simple and expressive, never rendered.
avoid: >-
  vector cleanliness, digital brushes with perfect pressure, full colour fills, photorealism
tags: [hand-drawn, ink, sketch, human]
origin: hand
