name: Memphis Pop
description: >-
  Squiggles, terrazzo and candy brights — 80s postmodern play. Back and here to stay.
look: >-
  Memphis design: clashing squiggles, zigzags, grids and terrazzo speckle in candy
  brights — pink, teal, yellow, lilac — over a pale ground. Flat matte fills with bold
  black geometric accents, shapes scattered with deliberate irreverence but balanced
  weight. A drop shadow here and there in a flat offset colour, never soft. The whole
  frame feels like a playful 80s showroom pattern sheet.
subject: >-
  A flat graphic figure built from Memphis shapes — triangle torso, squiggle hair
  energy, bold simple face — dropped confidently among the pattern.
avoid: >-
  gradients, photographic texture, muted palettes, minimalism, soft shadows
tags: [memphis, pop, pattern, playful]
origin: hand
