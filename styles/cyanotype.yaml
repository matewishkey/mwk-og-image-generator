name: Cyanotype
description: >-
  Prussian-blue photographic process with chemical edges. Archival, scientific, quiet.
look: >-
  Cyanotype print: the whole image in Prussian blue and paper white, with the soft
  silhouette edges, chemical staining and brush-coated borders of a hand-made contact
  print. Tonal range compressed and luminous, highlights blooming slightly, handmade
  paper texture showing through the emulsion. Composition simple and botanical-plate
  calm, objects arranged with specimen-like care.
subject: >-
  Rendered as a soft-edged cyanotype figure — features gently diffused, silhouette
  strong, like a photogram of a person more than a photograph.
avoid: >-
  any second colour, digital sharpness, clean straight borders, high contrast blacks
tags: [cyanotype, blue, process, archival]
origin: hand
