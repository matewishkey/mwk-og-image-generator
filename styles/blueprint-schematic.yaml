name: Blueprint Schematic
description: >-
  White technical linework on Prussian blue, like a drafting table original. The
  "how it works" look — a defining 2026 trend.
look: >-
  Technical blueprint drafting: crisp white and pale-cyan line drawing on a deep Prussian
  blue ground, with a faint grid, thin ruled construction lines, dimension arrows and small
  circled callouts. Objects drawn in clean orthographic or exploded views with hatching for
  depth, flat matte finish, slight cyanotype unevenness in the blue. Composition organised
  like an engineering sheet — one main figure, satellites around it, generous margins.
subject: >-
  Rendered as a white contour line drawing of them, schematic and elegant — glasses, hair
  and posture as clean linework, no shading beyond sparse hatching.
avoid: >-
  photographic texture, colour beyond blue and white, filled shapes, 3D rendering, grunge
tags: [blueprint, technical, line, blue]
origin: hand
