name: Ligne Claire
description: >-
  Clean uniform outlines and flat colour, Franco-Belgian comic tradition. Crisp narrative
  clarity without anime's drama.
look: >-
  Ligne claire comic illustration: uniform-weight clean black outlines around every form,
  flat unmodulated colour fills with no gradients, hatching or rendered shadow — at most a
  single flat cast-shadow shape. Bright, slightly chalky Franco-Belgian palette, even
  daylight clarity everywhere, backgrounds drawn with the same line discipline as the
  foreground. Composition calm and readable, like a classic album panel.
subject: >-
  Drawn with the same clear line — simple dot-and-line facial features, real adult
  proportions, likeness in hair shape, glasses and dress.
avoid: >-
  variable line weight, cel-shading steps, manga stylisation, painterly texture, gradients
tags: [comic, ligne-claire, flat, clean]
origin: hand
