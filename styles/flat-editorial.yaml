name: Flat Editorial
description: Vector editorial illustration. Best for a concept or a joke rather than a person.
look: >-
  Flat vector editorial illustration in the style of a broadsheet tech column. Bold simple
  shapes, no gradients beyond a single subtle paper grain, thick confident outlines used
  sparingly. Limited palette of four colours: off-white, deep ink navy, a muted clay red,
  one bright accent. Generous white space, strong diagonal composition, slightly oversized
  props to carry the metaphor.
subject: >-
  Reduced to a simple flat character with the same hair, build and glasses as the
  reference, recognisable by silhouette rather than by facial detail.
avoid: >-
  gradients, drop shadows, 3D shading, photorealism, corporate clip-art
tags: [vector, editorial, conceptual]
origin: hand
