name: Riso Print
description: Two-colour risograph poster. Loud, cheap-looking on purpose, scroll-stopping.
look: >-
  Two-colour risograph print on rough uncoated stock. Exactly two inks — fluorescent red
  and deep blue — overprinting into a third colour where they cross. Visible halftone dot
  texture, deliberate 1-2mm misregistration, ink smudging at the edges, paper fibre
  showing through. Bold poster composition, subject large in frame, heavy crop.
subject: >-
  Reduced to high-contrast halftone with blown-out highlights and solid shadow shapes,
  still clearly the same person by hair, glasses and jawline.
avoid: >-
  more than two inks, smooth gradients, digital cleanliness, perfect registration
tags: [print, graphic, bold]
origin: hand
