name: Neon Terminal
description: Late-night developer energy. Screens, glow, dark room.
look: >-
  Cinematic dark interior lit almost entirely by screens. Deep near-black background with
  cyan and magenta screen glow spilling across surfaces, volumetric haze catching the
  light, wet reflective desk. Long exposure feel with slight motion smear on the edges.
  Shallow focus, heavy bokeh from distant LEDs. Colour graded cold with a single hot red
  practical light somewhere in frame.
subject: >-
  Lit from below and in front by the monitor, face half in shadow, expression
  concentrated. Keep them clearly recognisable.
avoid: >-
  daylight, clean bright offices, floating UI holograms, matrix green code rain
tags: [dark, cinematic, tech]
origin: hand
