name: Art Deco
description: >-
  Gilded geometric symmetry and jewel tones — the milestone and premium-announcement look.
look: >-
  Art deco poster style: symmetrical geometric composition with fan motifs, sunbursts and
  stepped frames, deep jewel tones — emerald, sapphire, burgundy, black — with metallic
  gold accent lines that catch a soft sheen. Smooth lacquered finish, crisp hard edges,
  stylised elongated forms. Ornament is disciplined: a few strong repeating motifs, never
  filigree clutter. The whole frame feels like an engraved invitation.
subject: >-
  Stylised into elegant elongated deco proportions, posed statuesque in profile or
  three-quarter, hair and clothing simplified into sleek geometric shapes.
avoid: >-
  photorealism, pastel palettes, rough texture, asymmetry without purpose, busy filigree
tags: [deco, gold, geometric, premium]
origin: hand
