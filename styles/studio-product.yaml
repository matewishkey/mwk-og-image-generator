name: Studio Product
description: >-
  Seamless-backdrop commercial photography with controlled softbox light. The launch and
  feature-reveal look.
look: >-
  High-end studio product photography: a seamless single-colour cyclorama backdrop,
  large softbox key with a crisp specular highlight, clean fill, and a shallow soft
  contact shadow grounding every object. True colour, immaculate focus front to back on
  the hero, gentle falloff behind. Composition centred or on a clean third with generous
  margin, styled like a premium e-commerce hero shot.
subject: >-
  Photographed as if for a premium brand campaign — even flattering studio light, crisp
  focus, relaxed professional presence, no props beyond what the scene demands.
avoid: >-
  location backgrounds, harsh shadows, lens flare, grain, cluttered styling, HDR
tags: [photographic, studio, product, clean]
origin: hand
