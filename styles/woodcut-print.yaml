name: Woodcut Print
description: >-
  Hand-carved relief print with visible gouge marks — gravitas and craft in one. Part of
  the 2026 print revival.
look: >-
  Traditional woodcut relief print: heavy hand-carved black linework with visible gouge
  marks and chatter, bold areas of solid ink against untouched cream paper, one restrained
  spot colour laid slightly off-register. High contrast, rough ink-on-paper texture with
  uneven coverage at the edges of strokes. Composition is strong and frontal, forms
  simplified into carvable shapes with dramatic hatching for tone.
subject: >-
  Carved as a bold portrait — thick contour lines, hatched shadow across one side of the
  face, expression grave and direct; likeness lives in the strong outline.
avoid: >-
  fine smooth lines, gradients, photographic detail, digital cleanliness, bright palettes
tags: [woodcut, print, carved, high-contrast]
origin: hand
