name: Paper Cut
description: >-
  Layered cut-paper collage with real depth and soft shadows. Tactile and warm — craft you
  can almost touch.
look: >-
  Layered paper-cut craft: every element cut from matte coloured card and stacked in
  physical layers, each casting a small soft shadow on the layer below. Slightly imperfect
  scissor edges, visible paper thickness at the cuts, and a gentle top-down light. A
  harmonious palette of five or six card colours, with background depth built from two or
  three receding paper planes. The whole scene reads as a photographed paper diorama.
subject: >-
  Built from cut paper shapes — hair one piece, glasses another — with the likeness carried
  by shape and colour, layered so they stand slightly proud of the background.
avoid: >-
  flat vector look, digital gradients, glossy surfaces, photographic elements, hard shadows
tags: [paper, craft, tactile, layered]
origin: hand
