name: Embroidered Stitch
description: >-
  Visible thread on fabric, hooped and handmade. Rides the 2026 tactile-craft wave.
look: >-
  Hand embroidery on natural linen: every form built from visible stitches — satin stitch
  fills, chain stitch outlines, French knots for texture — with real thread sheen and
  slightly raised relief casting tiny shadows. Folk-bright palette of a few thread
  colours on the warm fabric ground, fabric weave clearly visible in the negative space,
  edges of shapes honestly stitch-stepped. Composition sits centred like a framed hoop
  piece.
subject: >-
  Stitched as an embroidered figure — satin-stitch hair, a few precise stitches for the
  face, outfit in flat thread fills; charming, not precious.
avoid: >-
  printed-texture fakery, smooth vector edges, photographic elements, gradients, gloss
tags: [embroidery, thread, craft, tactile]
origin: hand
