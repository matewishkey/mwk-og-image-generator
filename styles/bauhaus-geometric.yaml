name: Bauhaus Geometric
description: >-
  Primary-colour geometry on a strict grid — unkillable poster language for process and
  systems content.
look: >-
  Bauhaus composition: circles, triangles and bars in primary red, blue and yellow plus
  black, arranged on a strict underlying grid over off-white. Flat matte fills, no
  gradients, no texture beyond the faintest paper tone. Diagonals used deliberately for
  energy; overlaps create simple secondary shapes; huge amounts of disciplined negative
  space. Every element feels placed by a ruler and a reason.
subject: >-
  Abstracted into the geometry — a circle for the head, angled bars for the body, one
  recognising detail (glasses arc, hair wedge) rendered as a clean shape.
avoid: >-
  gradients, texture, photographic elements, decorative flourish, more than five colours
tags: [bauhaus, geometric, primary, grid]
origin: hand
