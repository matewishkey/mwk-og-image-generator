name: Ukiyo-e Woodblock
description: >-
  Japanese woodblock flatness with bokashi gradient wipes and mineral colour. Serene and
  timeless.
look: >-
  Ukiyo-e woodblock print: flat planes of muted mineral colour — indigo, ochre, sage,
  vermilion accents — separated by a delicate dark keyline, with bokashi gradient wipes
  softening skies and water. Visible woodgrain ghosting through large flat areas, washi
  paper tone in the ground, stylised waves, clouds and foliage drawn as rhythmic pattern.
  Composition uses bold asymmetry, high horizons and generous emptiness.
subject: >-
  Drawn in ukiyo-e figure style — graceful line, flat colour robes or clothing, calm
  stylised features; likeness held by hair, glasses and stance.
avoid: >-
  western shading, photorealism, saturated modern palettes, thick outlines, gloss
tags: [ukiyo-e, woodblock, japanese, serene]
origin: hand
