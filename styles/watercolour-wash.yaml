name: Watercolour Wash
description: >-
  Translucent washes and bleeding edges on textured paper. Warmth and approachability
  without a single hard line.
look: >-
  Traditional watercolour on cold-press paper, the grain showing through every wash.
  Translucent layered colour with soft bleeding edges, deliberate blooms where wet met wet,
  and dry-brush texture on the last pass. A light, airy palette with plenty of paper left
  white; edges of the image fade out rather than ending. One or two pencil underdrawing
  lines remain faintly visible under the paint.
subject: >-
  Painted loosely — features suggested with a few darker touches, likeness carried by hair
  colour, glasses and posture, skin left as a pale wash.
avoid: >-
  digital gradients, hard outlines, saturated poster colour, photorealism, black shadows
tags: [watercolour, painted, warm, airy]
origin: hand
