name: Aerial Top-Down
description: >-
  Straight-down drone photography — naturally graphic, band-friendly. Scale and overview
  themes.
look: >-
  Straight-down aerial drone photography: the world flattened into graphic pattern —
  paths, rooftops, fields and shadows reading as composition. Crisp natural light with
  long clean shadows giving depth to the flatness, true colour with gentle contrast,
  high-resolution clarity edge to edge. Framing balances one focal cluster against
  large calm areas of ground texture.
subject: >-
  A small figure seen from directly above — readable by shadow, outfit colour and what
  they carry; the pattern around them does the storytelling.
avoid: >-
  oblique angles, horizon lines, tilt-shift blur, desaturated grading, night scenes
tags: [photographic, aerial, top-down, pattern]
origin: hand
