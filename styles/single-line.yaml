name: Single Line
description: >-
  One continuous contour line on a plain ground. Elegant, technical, almost empty — for
  refined tech and editorial spots.
look: >-
  Minimal contour line art: a single uniform-weight line describing the whole subject in
  one near-continuous stroke, monochrome ink on a plain warm-white ground. No fills, no
  shading, no crosshatching — at most one small solid accent dot of colour where the eye
  should land. The line economises ruthlessly, capturing form with the fewest possible
  bends, and the composition floats small in generous space.
subject: >-
  Reduced to a continuous-line portrait — one stroke finds the hair, glasses and jaw;
  identity lives entirely in the silhouette the line describes.
avoid: >-
  varying line weight, sketch construction lines, fills, shadows, backgrounds, colour fields
tags: [line-art, minimal, elegant, mono]
origin: hand
