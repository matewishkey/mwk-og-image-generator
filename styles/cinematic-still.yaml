name: Cinematic Still
description: >-
  A frame lifted from a film — scene-scale drama where the whole environment acts, not just
  a face. Use when the story is bigger than a portrait.
look: >-
  Widescreen film still with anamorphic character: oval bokeh, gentle horizontal flare,
  slight edge softness. Dramatic directional key light motivated by something in the scene,
  atmosphere in the air catching it. Teal-and-amber grade with deep, detailed shadows and
  restrained highlights, filmic grain and halation. Blocking and set dressing feel
  production-designed; every prop looks placed on purpose.
subject: >-
  Photographed as an actor inside the scene — mid-action, lit by the scene's own sources,
  face readable but never posed at the camera.
avoid: >-
  flat lighting, centered passport framing, clean digital sharpness, HDR, empty sets
tags: [photographic, cinematic, dramatic, scene]
origin: hand
